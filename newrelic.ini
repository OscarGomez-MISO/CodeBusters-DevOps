[newrelic]
# Identity, license, enabled flag and logging destination come from runtime env.
log_level = info
attributes.exclude = request.parameters.* request.headers.* request.uri http.url url.full
transaction_tracer.record_sql = obfuscated
application_logging.forwarding.enabled = false
browser_monitoring.enabled = false
ai_monitoring.basic_telemetry.enabled = false
