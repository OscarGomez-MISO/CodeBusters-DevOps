services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: blacklists
      POSTGRES_USER: blacklists
      POSTGRES_PASSWORD: local-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blacklists -d blacklists"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
